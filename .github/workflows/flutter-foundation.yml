name: Validate Flutter migration contracts
on:
  push:
    branches: [migration/flutter-native-foundation]
    paths: ['migration/flutter_native/**', '.github/workflows/flutter-foundation.yml']
  pull_request:
    paths: ['migration/flutter_native/**', '.github/workflows/flutter-foundation.yml']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s migration/flutter_native/tests -v
      # No APK or publication job: these are contracts, not a Flutter app.
