name: v0.8 milestone checks
on:
  push:
    branches: ['release/v0.8']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python scripts/prepare_upgrade.py && python scripts/prepare_game.py && python scripts/prepare_assets.py && python scripts/prepare_power.py
      - run: npx playwright install --with-deps chromium
      - run: node tests/projects.test.cjs && node tests/learning.test.cjs && node tests/upgrade.test.cjs && npm test
      - run: node tests/v08-editor.test.cjs && node tests/v08-editor-ui.test.cjs
      - run: node tests/v08-overlays.test.cjs
      - run: node tests/projects-ui.test.cjs && node tests/upgrade-ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v08-milestone-evidence
          include-hidden-files: true
          path: .artifacts/
