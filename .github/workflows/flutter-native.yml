name: Build Flutter native preview
on:
  push:
    branches: [migration/flutter-native-foundation]
    paths: ['flutter_native/**', 'native_toolchain/package.py', 'native_toolchain/runner.c', '.github/workflows/flutter-native.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.35.5', channel: stable, cache: true}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36975192437
          pattern: clang8-*
          path: .native-artifacts
      - name: Install matching compiler sysroot
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;20.1.5948944"'
      - name: Bundle compiler and sysroot
        run: python native_toolchain/package.py --ndk "$ANDROID_HOME/ndk/20.1.5948944" --artifacts .native-artifacts --app flutter_native/android/app
      - name: Flutter dependencies and checks
        working-directory: flutter_native
        run: |
          python ../native_toolchain/fetch_fonts.py
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build preview APK
        working-directory: flutter_native
        run: flutter build apk --release --target-platform android-arm64,android-x64
      - name: Verify offline package
        run: python native_toolchain/check_apk.py flutter_native/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: codebridge-native-preview
          path: flutter_native/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify execution in Android application process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disk-size: 8G
          disable-animations: true
          script: cd flutter_native/android && ./gradlew app:connectedDebugAndroidTest
      - name: Preserve device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-device-test-reports
          path: |
            flutter_native/build/app/reports/androidTests
            flutter_native/build/app/outputs/androidTest-results
          if-no-files-found: ignore
