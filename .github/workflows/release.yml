name: Build CodeBridge apps
on:
  push:
    branches: [main]
    paths: ['app/**', 'desktop/**', 'android/**', 'build/**', 'scripts/**', 'package*.json', 'tests/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codebridge-release
  cancel-in-progress: false
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            executable: dist/win-unpacked/CodeBridge.exe
          - os: macos-15-intel
            platform: mac
            arch: x64
            executable: dist/mac/CodeBridge.app/Contents/MacOS/CodeBridge
          - os: macos-15
            platform: mac
            arch: arm64
            executable: dist/mac-arm64/CodeBridge.app/Contents/MacOS/CodeBridge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python scripts/prepare_assets.py
      - run: npm test
      - run: node tests/electron-smoke.cjs
      - run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged desktop application
        run: node tests/electron-smoke.cjs
        env:
          CODEBRIDGE_APP: ${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python scripts/prepare_assets.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - run: node tests/native-debug.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-screenshots
          include-hidden-files: true
          path: .artifacts/*.png
  android:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci --ignore-scripts
      - run: python scripts/prepare_assets.py
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: codebridge-test-signing-v2
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          disable-animations: true
          script: |
            cd android && gradle :app:connectedDebugAndroidTest --stacktrace
            adb shell am start -n com.codebridge.mobile/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-screen.png
      - name: Prepare APK
        if: success()
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CodeBridge-0.2.0-Android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-screen.png
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: CodeBridge-0.2.0-Android.apk
          if-no-files-found: error
  publish:
    needs: [desktop, android, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: release-files
      - run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
      - name: Publish beta downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.2.0-beta.${{ github.run_number }}
          RELEASE_TAG: v0.2.0-beta.${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --target "$GITHUB_SHA" --title "CodeBridge Studio 0.2 — offline apps" --notes-file RELEASE_NOTES.md --prerelease
          fi
