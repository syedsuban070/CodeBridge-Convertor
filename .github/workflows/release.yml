name: Build CodeBridge Android
on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', 'build/**', 'scripts/**', 'package*.json', 'tests/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codebridge-release
  cancel-in-progress: true
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
      - run: python scripts/prepare_upgrade.py
      - run: python scripts/prepare_game.py
      - run: python scripts/prepare_assets.py
      - run: python scripts/prepare_power.py
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tests/terminal.test.cjs
      - run: node tests/learning.test.cjs
      - run: node tests/game.test.cjs
      - run: node tests/projects.test.cjs
      - run: node tests/projects-ui.test.cjs
      - run: node tests/upgrade.test.cjs
      - run: node tests/upgrade-ui.test.cjs
      - run: node tests/game-ui.test.cjs
      - run: node tests/curriculum-wasm.test.cjs
      - run: python scripts/check_curriculum.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-screenshots
          include-hidden-files: true
          path: .artifacts/*.png
  android:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci --ignore-scripts
      - run: python scripts/prepare_upgrade.py
      - run: python scripts/prepare_game.py
      - run: python scripts/prepare_assets.py
      - run: python scripts/prepare_power.py
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - uses: actions/cache@v4
        with:
          path: android/app/codebridge-beta.keystore
          key: codebridge-beta-signing-file-v3
      - name: Ensure cached beta signing key
        run: |
          if [ ! -f android/app/codebridge-beta.keystore ]; then
            keytool -genkeypair -keystore android/app/codebridge-beta.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          chmod 600 android/app/codebridge-beta.keystore
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
        working-directory: android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -partition-size 4096
          disable-animations: true
          script: |
            curl --fail --location --retry 3 -o previous.apk https://github.com/syedsuban070/CodeBridge-Convertor/releases/download/v0.7.2-beta.16/CodeBridge-0.7.2-Android.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs previous.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb install previous.apk
            adb shell am start -n com.codebridge.mobile/.MainActivity
            sleep 3
            adb shell am force-stop com.codebridge.mobile
            adb shell run-as com.codebridge.mobile mkdir -p files
            adb shell run-as com.codebridge.mobile touch files/upgrade-sentinel.txt
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell run-as com.codebridge.mobile ls files/upgrade-sentinel.txt
            cd android && gradle :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Download/codebridge-keyboard.png android-keyboard.png
            adb install -r "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -n com.codebridge.mobile/.MainActivity
            sleep 3
            adb exec-out screencap -p > android-screen.png
      - name: Verify APK signatures and alignment
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK
        if: success()
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CodeBridge-0.7.5-Android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android-screen.png
            android-keyboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: CodeBridge-0.7.5-Android.apk
          if-no-files-found: error
  publish:
    needs: [android, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: release-files
      - run: |
          cd release-files
          sha256sum * > SHA256SUMS.txt
      - name: Publish beta downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.7.5-beta.${{ github.run_number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* --target "$GITHUB_SHA" --title "CodeBridge 0.7.5 — project studio and guided learning paths" --notes-file RELEASE_NOTES.md --prerelease
          fi
