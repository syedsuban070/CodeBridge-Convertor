name: Build native Clang 8 toolchain
on:
  push:
    branches: [migration/flutter-native-foundation]
    paths: ['native_toolchain/**', '.github/workflows/native-toolchain.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clang:
    timeout-minutes: 120
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install matched LLVM-era Android NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;20.1.5948944"' 
      - uses: actions/cache@v4
        with:
          path: .native-work
          key: native-clang8-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('native_toolchain/**') }}
          restore-keys: native-clang8-${{ runner.os }}-${{ matrix.abi }}-
      - name: Build native compiler and linker
        run: python native_toolchain/build.py --ndk "$ANDROID_HOME/ndk/20.1.5948944" --work .native-work --abi '${{ matrix.abi }}' --jobs 2
      - uses: actions/upload-artifact@v4
        with:
          name: clang8-${{ matrix.abi }}
          path: .native-work/output/${{ matrix.abi }}
          if-no-files-found: error
