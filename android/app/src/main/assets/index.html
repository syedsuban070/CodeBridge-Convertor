<!doctype html><html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>CodeBridge</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#172035;--line:#2b3957;--ink:#e7efff;--muted:#9caccc;--cyan:#5ce6dd;--orange:#ffbf73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}.app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}header{padding:13px 16px 8px;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0;letter-spacing:.3px}h1 span{color:var(--cyan)}.tag{font-size:10px;color:var(--orange);border:1px solid #745e41;padding:4px 7px;border-radius:12px}.bar{display:flex;gap:7px;padding:8px 12px;overflow:auto}button{background:var(--surface);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font-weight:650;white-space:nowrap}button.primary{background:#087e82;border-color:#2ac3c3}button:active{opacity:.7}.file{display:flex;align-items:center;gap:8px;padding:3px 13px;color:var(--muted)}#filename{min-width:0;flex:1;background:transparent;border:0;color:var(--ink);font:600 13px monospace}.hint{font-size:11px;color:var(--muted);padding:4px 13px}textarea{display:block;flex:1;min-height:120px;margin:8px 12px;background:#0e1729;color:#d9eafd;border:1px solid var(--line);border-radius:12px;resize:none;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;outline:none}textarea:focus{border-color:var(--cyan)}.panel{height:32%;min-height:180px;border-top:1px solid var(--line);display:flex;flex-direction:column}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:7px 13px;color:var(--cyan);font-weight:700}.panelhead button{padding:5px 9px;font-size:11px}pre{margin:0;padding:8px 13px;overflow:auto;flex:1;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace;color:#d9eafd}.status{color:var(--muted);font-size:11px;padding:7px 13px;border-top:1px solid var(--line)}
</style></head><body><div class="app"><header><h1>Code<span>Bridge</span></h1><div class="tag">MOBILE PREVIEW</div></header><div class="bar"><button onclick="newFile()">New</button><button onclick="AndroidFiles.open()">Open</button><button onclick="saveFile()">Save</button><button class="primary" onclick="runCode()">▶ Run subset</button><button onclick="startDebug()">Step debug</button></div><div class="file"><label for="filename">FILE</label><input id="filename" value="main.c" spellcheck="false"></div><div class="hint">Offline C/C++ learning subset · no network or native compiler</div><textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea><div class="panel"><div class="panelhead"><span>OUTPUT / TRACE</span><button id="next" onclick="nextStep()" hidden>Next step →</button></div><pre id="output">Write code, then tap Run subset.</pre><div id="status" class="status">Supported: main, int variables, if, for, while, printf, cout. Unsupported code reports an error.</div></div></div><script src="engine.js"></script><script src="app.js"></script></body></html>
